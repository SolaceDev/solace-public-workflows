name: "Guardian Container Scan and Sync"
description: "Scan a container image with Prisma Cloud (and optionally Trivy), upload the results to Guardian, then run Guardian's DB and Jira sync."
author: "Solace"

inputs:
  image_registry:
    description: "Docker image registry. The image must already be pushed (or available locally with `skip_image_pull`)."
    required: true
  image_repo:
    description: "Docker image repository name. Defaults to the GitHub repository name."
    required: false
    default: ""
  image_tag:
    description: "Docker image tag to scan."
    required: true
  pcc_console_url:
    description: "Prisma Cloud Console URL."
    required: true
  pcc_user:
    description: "Prisma Cloud Access Key ID."
    required: true
  pcc_pass:
    description: "Prisma Cloud Secret Access Key."
    required: true
  guardian_url:
    description: "Guardian API base URL. Masked from the action's first step onward; pass it as a secret to keep it out of the logged inputs too."
    required: true
  guardian_key:
    description: "Guardian API bearer token. Pass it as a secret."
    required: true
  guardian_product_name:
    description: "Guardian product name. Defaults to `image_repo`."
    required: false
    default: ""
  guardian_product_version:
    description: "Guardian product version (stream) the scans are uploaded under. Defaults to the repository default branch. Should match the product's trunk branch in Guardian, which is what the sync reconciles."
    required: false
    default: ""
  guardian_product_full_version:
    description: "Guardian product full version (the build). Defaults to `image_tag`."
    required: false
    default: ""
  run_trivy:
    description: "Also scan the image with Trivy and sync its findings (`true`/`false`)."
    required: false
    default: "false"
  trivy_version:
    description: "Trivy version used when `run_trivy` is true."
    required: false
    default: "v0.69.2"
  show_detailed_logs:
    description: "Show per-finding detail in logs, job summaries and artifacts (`true`/`false`). Defaults to `false` for public repositories (or when visibility cannot be determined) and `true` otherwise."
    required: false
    default: ""
  twistcli_publish:
    description: "Publish Prisma scan results to the Prisma Cloud Console."
    required: false
    default: "false"
  bypass_blocking:
    description: "Never fail on Prisma scan findings. Guardian owns vulnerability blocking when it is configured."
    required: false
    default: "true"
  skip_image_pull:
    description: "Skip pulling the image (use when it is already available locally)."
    required: false
    default: "false"
  create_status_check:
    description: "Post a \"Guardian Scan\" check run with the Guardian report. Skipped with a notice when the token lacks `checks: write`."
    required: false
    default: "true"
  guardian_dashboard_url:
    description: "Guardian dashboard base URL. When set, the detailed report links findings to it."
    required: false
    default: ""
  jira_base_url:
    description: "Jira base URL used to link the Jira issues in the detailed report."
    required: false
    default: "https://sol-jira.atlassian.net"
  jira_dry_run:
    description: "Run Guardian's Jira reporting in dry-run mode."
    required: false
    default: "false"
  upload_logs:
    description: "Upload Guardian sync request logs as a workflow artifact."
    required: false
    default: "false"

outputs:
  prisma_scan_passed:
    description: "Whether the Prisma scan passed this action's policy (true/false)."
    value: ${{ steps.prisma.outputs.scan_passed }}
  prisma_vuln_critical:
    description: "Prisma critical vulnerability count."
    value: ${{ steps.prisma.outputs.vuln_critical }}
  prisma_vuln_high:
    description: "Prisma high vulnerability count."
    value: ${{ steps.prisma.outputs.vuln_high }}
  prisma_vuln_medium:
    description: "Prisma medium vulnerability count."
    value: ${{ steps.prisma.outputs.vuln_medium }}
  prisma_vuln_low:
    description: "Prisma low vulnerability count."
    value: ${{ steps.prisma.outputs.vuln_low }}
  prisma_console_link:
    description: "Link to the Prisma Cloud Console results, when available."
    value: ${{ steps.prisma.outputs.console_link }}
  trivy_status:
    description: "Trivy result: `success` (scanned and uploaded), `failure`, or `skipped`."
    value: ${{ steps.unifiers.outputs.trivy_status }}
  trivy_vuln_critical:
    description: "Trivy critical vulnerability count."
    value: ${{ steps.trivy_summary.outputs.vuln_critical }}
  trivy_vuln_high:
    description: "Trivy high vulnerability count."
    value: ${{ steps.trivy_summary.outputs.vuln_high }}
  trivy_vuln_medium:
    description: "Trivy medium vulnerability count."
    value: ${{ steps.trivy_summary.outputs.vuln_medium }}
  trivy_vuln_low:
    description: "Trivy low vulnerability count."
    value: ${{ steps.trivy_summary.outputs.vuln_low }}
  trivy_vuln_unknown:
    description: "Trivy unknown-severity vulnerability count."
    value: ${{ steps.trivy_summary.outputs.vuln_unknown }}
  guardian_blocking_count:
    description: "Findings past their SLA for this build, per Guardian."
    value: ${{ steps.report.outputs.blocking_count }}
  guardian_pending_count:
    description: "Findings still within their SLA for this build, per Guardian."
    value: ${{ steps.report.outputs.pending_count }}
  guardian_check_run_url:
    description: "URL of the Guardian Scan check run, when one was posted."
    value: ${{ steps.report.outputs.check_run_url }}
  unifiers:
    description: "Comma-separated scanners included in the Guardian sync (e.g. `prisma` or `prisma,trivy`); empty if nothing was synced."
    value: ${{ steps.unifiers.outputs.unifiers }}
  product_name:
    description: "Product name reported by the Guardian sync."
    value: ${{ steps.sync.outputs.product_name }}
  product_version:
    description: "Product version reported by the Guardian sync."
    value: ${{ steps.sync.outputs.product_version }}
  response_json:
    description: "Compact JSON response from the Guardian sync."
    value: ${{ steps.sync.outputs.response_json }}

runs:
  using: "composite"
  steps:
    - name: Mask credentials and validate inputs
      shell: bash
      env:
        GUARDIAN_URL: ${{ inputs.guardian_url }}
        GUARDIAN_KEY: ${{ inputs.guardian_key }}
        PCC_CONSOLE_URL: ${{ inputs.pcc_console_url }}
        PCC_USER: ${{ inputs.pcc_user }}
        PCC_PASS: ${{ inputs.pcc_pass }}
        RUN_TRIVY: ${{ inputs.run_trivy }}
      run: |
        set -euo pipefail
        for value in "$GUARDIAN_URL" "$GUARDIAN_KEY" "$PCC_CONSOLE_URL" "$PCC_USER" "$PCC_PASS"; do
          if [ -n "$value" ]; then
            echo "::add-mask::$value"
          fi
        done

        if [ -z "$GUARDIAN_URL" ] || [ -z "$GUARDIAN_KEY" ]; then
          echo "::error::guardian_url and guardian_key are required."
          exit 1
        fi
        if [ "$RUN_TRIVY" != "true" ] && [ "$RUN_TRIVY" != "false" ]; then
          echo "::error::run_trivy must be 'true' or 'false' (got '$RUN_TRIVY')."
          exit 1
        fi

    # Resolve names once and pass them explicitly to every step, so the Prisma
    # upload, the Trivy upload and the sync all target the same Guardian scan.
    - name: Resolve scan context
      id: ctx
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_IMAGE_REPO: ${{ inputs.image_repo }}
        IMAGE_REGISTRY: ${{ inputs.image_registry }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        INPUT_PRODUCT_NAME: ${{ inputs.guardian_product_name }}
        INPUT_PRODUCT_VERSION: ${{ inputs.guardian_product_version }}
        INPUT_FULL_VERSION: ${{ inputs.guardian_product_full_version }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch || '' }}
        EVENT_VISIBILITY: ${{ github.event.repository.visibility || '' }}
        INPUT_SHOW_DETAILED_LOGS: ${{ inputs.show_detailed_logs }}
      run: |
        set -euo pipefail
        REPO_NAME="${INPUT_IMAGE_REPO:-${GITHUB_REPOSITORY#*/}}"
        PRODUCT_NAME="${INPUT_PRODUCT_NAME:-$REPO_NAME}"
        PRODUCT_VERSION="${INPUT_PRODUCT_VERSION:-$DEFAULT_BRANCH}"
        FULL_VERSION="${INPUT_FULL_VERSION:-$IMAGE_TAG}"
        if [ -z "$PRODUCT_VERSION" ]; then
          echo "::error::guardian_product_version is required when the repository default branch is unavailable."
          exit 1
        fi

        VISIBILITY="$EVENT_VISIBILITY"
        if [ -z "$VISIBILITY" ]; then
          VISIBILITY="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility 2>/dev/null || true)"
        fi

        # Fail closed: unknown visibility is treated like public.
        SHOW_DETAILS="$(printf '%s' "$INPUT_SHOW_DETAILED_LOGS" | tr '[:upper:]' '[:lower:]')"
        if [ -z "$SHOW_DETAILS" ]; then
          if [ "$VISIBILITY" = "private" ] || [ "$VISIBILITY" = "internal" ]; then
            SHOW_DETAILS="true"
          else
            SHOW_DETAILS="false"
          fi
        fi

        # Unique per image and product, so several scans in one job don't share
        # a report directory or an artifact name.
        SCAN_KEY="${REPO_NAME}-${IMAGE_TAG}"
        if [ "$PRODUCT_NAME" != "$REPO_NAME" ]; then
          SCAN_KEY="${PRODUCT_NAME}-${SCAN_KEY}"
        fi
        SCAN_KEY="$(printf '%s' "$SCAN_KEY" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-')"
        TRIVY_DIR="${RUNNER_TEMP}/guardian-trivy-${SCAN_KEY:-scan}"
        # A failed scan must not pick up an earlier scan's report.
        rm -rf "$TRIVY_DIR/trivy_scan.json" "$TRIVY_DIR/tmp"
        mkdir -p "$TRIVY_DIR/tmp"

        {
          echo "repo_name=$REPO_NAME"
          echo "image_ref=${IMAGE_REGISTRY}/${REPO_NAME}:${IMAGE_TAG}"
          echo "image_display=${REPO_NAME}:${IMAGE_TAG}"
          echo "product_name=$PRODUCT_NAME"
          echo "product_version=$PRODUCT_VERSION"
          echo "full_version=$FULL_VERSION"
          echo "visibility=${VISIBILITY:-unknown}"
          echo "show_details=$SHOW_DETAILS"
          echo "scan_key=${SCAN_KEY:-scan}"
          echo "trivy_dir=$TRIVY_DIR"
        } >> "$GITHUB_OUTPUT"
        echo "Scanning ${REPO_NAME}:${IMAGE_TAG} for Guardian product ${PRODUCT_NAME} (${PRODUCT_VERSION} / ${FULL_VERSION})."

    - name: Prisma Cloud scan and Guardian upload
      id: prisma
      uses: $/prisma-cloud-scan
      with:
        image_registry: ${{ inputs.image_registry }}
        image_repo: ${{ steps.ctx.outputs.repo_name }}
        image_tag: ${{ inputs.image_tag }}
        pcc_console_url: ${{ inputs.pcc_console_url }}
        pcc_user: ${{ inputs.pcc_user }}
        pcc_pass: ${{ inputs.pcc_pass }}
        twistcli_publish: ${{ inputs.twistcli_publish }}
        bypass_blocking: ${{ inputs.bypass_blocking }}
        skip_image_pull: ${{ inputs.skip_image_pull }}
        # Guardian is the single reporter for this action (see the report step).
        create_status_check: "false"
        write_step_summary: "false"
        show_detailed_logs: ${{ steps.ctx.outputs.show_details }}
        guardian_url: ${{ inputs.guardian_url }}
        guardian_key: ${{ inputs.guardian_key }}
        guardian_product_name: ${{ steps.ctx.outputs.product_name }}
        guardian_product_version: ${{ steps.ctx.outputs.product_version }}
        guardian_product_full_version: ${{ steps.ctx.outputs.full_version }}

    # A failure in one scanner must not stop the other's findings from syncing,
    # but it must not pass silently either: the sync includes only the scanners
    # whose results reached Guardian, and the action still fails (a failed
    # Prisma step fails it; see the last step for Trivy).
    - name: Trivy scan
      id: trivy_scan
      if: ${{ !cancelled() && steps.ctx.outcome == 'success' && inputs.run_trivy == 'true' }}
      continue-on-error: true
      # Trivy exports the image and extracts analyzed files under TMPDIR. /tmp is a
      # size-capped tmpfs on newer runner images (ubuntu-26.04), too small for large
      # images, so keep its scratch space on the runner disk.
      env:
        TMPDIR: ${{ steps.ctx.outputs.trivy_dir }}/tmp
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        image-ref: ${{ steps.ctx.outputs.image_ref }}
        format: json
        output: ${{ steps.ctx.outputs.trivy_dir }}/trivy_scan.json
        scanners: vuln
        version: ${{ inputs.trivy_version }}

    - name: Summarize Trivy results
      id: trivy_summary
      if: ${{ !cancelled() && steps.ctx.outcome == 'success' && inputs.run_trivy == 'true' }}
      shell: bash
      env:
        TRIVY_FILE: ${{ steps.ctx.outputs.trivy_dir }}/trivy_scan.json
        IMAGE_DISPLAY: ${{ steps.ctx.outputs.image_display }}
        TRIVY_VERSION: ${{ inputs.trivy_version }}
        SHOW_DETAILS: ${{ steps.ctx.outputs.show_details }}
        REPO_VISIBILITY: ${{ steps.ctx.outputs.visibility }}
        WRITE_STEP_SUMMARY: "false"
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/scripts/summarize_trivy_results.py"

    - name: Upload Trivy results to Guardian
      id: trivy_upload
      if: ${{ !cancelled() && inputs.run_trivy == 'true' && steps.trivy_summary.outputs.scan_ok == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GUARDIAN_URL: ${{ inputs.guardian_url }}
        GUARDIAN_KEY: ${{ inputs.guardian_key }}
        PRODUCT_NAME: ${{ steps.ctx.outputs.product_name }}
        PRODUCT_VERSION: ${{ steps.ctx.outputs.product_version }}
        FULL_VERSION: ${{ steps.ctx.outputs.full_version }}
        TRIVY_FILE: ${{ steps.ctx.outputs.trivy_dir }}/trivy_scan.json
      run: |
        bash "$ACTION_PATH/scripts/upload_trivy_to_guardian.sh" \
          --guardian-url "$GUARDIAN_URL" \
          --guardian-key "$GUARDIAN_KEY" \
          --product-name "$PRODUCT_NAME" \
          --product-version "$PRODUCT_VERSION" \
          --product-full-version "$FULL_VERSION" \
          --trivy-file "$TRIVY_FILE"

    # The raw report lists every finding, so it is only kept when detail is enabled.
    - name: Upload Trivy report artifact
      if: ${{ !cancelled() && inputs.run_trivy == 'true' && steps.ctx.outputs.show_details == 'true' && steps.trivy_summary.outputs.scan_ok == 'true' }}
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: trivy-scan-results-${{ runner.os }}-${{ runner.arch }}-${{ steps.ctx.outputs.scan_key }}
        path: ${{ steps.ctx.outputs.trivy_dir }}/trivy_scan.json
        retention-days: 30
        if-no-files-found: warn

    - name: Resolve sync scanners
      id: unifiers
      if: ${{ !cancelled() && steps.ctx.outcome == 'success' }}
      shell: bash
      env:
        RUN_TRIVY: ${{ inputs.run_trivy }}
        PRISMA_UPLOAD_STATUS: ${{ steps.prisma.outputs.guardian_upload_status }}
        TRIVY_UPLOAD_OUTCOME: ${{ steps.trivy_upload.outcome }}
      run: |
        set -euo pipefail
        SCANNERS=()
        PRISMA_STATUS="failure"
        if [ "$PRISMA_UPLOAD_STATUS" = "success" ]; then
          SCANNERS+=(prisma)
          PRISMA_STATUS="success"
        else
          echo "::warning::Prisma results were not uploaded to Guardian; Prisma findings are not synced."
        fi
        TRIVY_STATUS="skipped"
        if [ "$RUN_TRIVY" = "true" ]; then
          if [ "$TRIVY_UPLOAD_OUTCOME" = "success" ]; then
            SCANNERS+=(trivy)
            TRIVY_STATUS="success"
          else
            TRIVY_STATUS="failure"
            echo "::warning::Trivy did not produce or upload results; Trivy findings are not synced."
          fi
        fi
        UNIFIERS="$(IFS=,; echo "${SCANNERS[*]:-}")"
        echo "unifiers=$UNIFIERS" >> "$GITHUB_OUTPUT"
        echo "prisma_status=$PRISMA_STATUS" >> "$GITHUB_OUTPUT"
        echo "trivy_status=$TRIVY_STATUS" >> "$GITHUB_OUTPUT"
        echo "Syncing scanners: ${UNIFIERS:-none}"

    - name: Guardian DB and Jira sync
      id: sync
      if: ${{ !cancelled() && steps.unifiers.outputs.unifiers != '' }}
      uses: $/guardian-db-sync
      with:
        guardian-url: ${{ inputs.guardian_url }}
        guardian-key: ${{ inputs.guardian_key }}
        product-name: ${{ steps.ctx.outputs.product_name }}
        product-full-version: ${{ steps.ctx.outputs.full_version }}
        unifiers: ${{ steps.unifiers.outputs.unifiers }}
        jira-dry-run: ${{ inputs.jira_dry_run }}
        upload-logs: ${{ inputs.upload_logs }}

    # Report-only: it reads Guardian after the sync and never fails the action.
    - name: Guardian report
      id: report
      if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GUARDIAN_URL: ${{ inputs.guardian_url }}
        GUARDIAN_KEY: ${{ inputs.guardian_key }}
        PRODUCT_NAME: ${{ steps.ctx.outputs.product_name }}
        PRODUCT_VERSION: ${{ steps.sync.outputs.product_version || steps.ctx.outputs.product_version }}
        FULL_VERSION: ${{ steps.ctx.outputs.full_version }}
        UNIFIERS: ${{ steps.unifiers.outputs.unifiers }}
        PRISMA_STATUS: ${{ steps.unifiers.outputs.prisma_status }}
        TRIVY_STATUS: ${{ steps.unifiers.outputs.trivy_status }}
        SYNC_RESPONSE: ${{ steps.sync.outputs.response_json }}
        SHOW_DETAILS: ${{ steps.ctx.outputs.show_details }}
        DASHBOARD_URL: ${{ inputs.guardian_dashboard_url }}
        JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        CREATE_CHECK: ${{ inputs.create_status_check }}
        GITHUB_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python3 "$ACTION_PATH/scripts/guardian_report.py"

    - name: Fail on Trivy error
      if: ${{ !cancelled() && steps.unifiers.outputs.trivy_status == 'failure' }}
      shell: bash
      run: |
        echo "::error::run_trivy was requested but Trivy results were not synced. Trivy-only findings were left unchanged."
        exit 1
