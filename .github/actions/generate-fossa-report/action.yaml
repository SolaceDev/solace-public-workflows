name: Generate FOSSA Report
description: Generate FOSSA attribution reports using the maas-build-actions Docker container.
inputs:
  fossa_api_key:
    description: "FOSSA API Key"
    required: true
  org_id:
    description: "The organization ID for FOSSA (e.g., custom+48578). Defaults to custom+48578 if not provided."
    required: false
    default: "custom+48578"
  project_locator:
    description: "The project locator for the FOSSA project (e.g., SolaceDev_solace-dotnet-serdes). This will be combined with org-id. Not used when release_group_id is provided."
    required: false
  fossa_config_file:
    description: "Path to FOSSA config file to read project locator from (default: .fossa.yml). Used only if project_locator is not provided."
    required: false
    default: ".fossa.yml"
  revision_id:
    description: "The revision for the FOSSA project (e.g., latest, or a specific commit hash). Not used when release_group_id is provided."
    required: false
  release_group_id:
    description: "FOSSA release group ID. When provided, generates a release group attribution report instead of a per-project report."
    required: false
  release_id:
    description: "FOSSA release ID within the release group. Required when release_group_id is provided."
    required: false
  format:
    description: "Report format (case-insensitive): HTML, MD, PDF, CSV, TXT, SPDX (SPDX 2.3 tag-value), SPDX_JSON (SPDX 2.3 JSON), SPDX3_JSON (SPDX 3.0.1), CYCLONEDX_JSON, CYCLONEDX_XML. Use SPDX3_JSON (SPDX 3.0) or SPDX_JSON (SPDX 2.3) for an SBOM. An unsupported value fails the step."
    required: true
    default: "txt"
  output_file:
    description: "The output file path for the generated report. When empty, defaults to fossa-report.<ext> with the extension chosen by format (e.g. fossa-report.txt for TXT, fossa-report.spdx3.json for SPDX3_JSON)."
    required: false
    default: ""
  report_profile:
    description: "Preset report profile: 'full' (comprehensive), 'standard' (common fields), 'minimal' (basic info only), or 'sbom' (licence, copyright and author data populated for SBOM formats; requires supplier)."
    required: false
    default: "standard"
  report_parameters:
    description: "A JSON object of FOSSA report parameters for advanced customization. Overrides report_profile if provided, except with report_profile 'sbom', where its keys are merged over the SBOM defaults."
    required: false
  supplier:
    description: "Organization name recorded as the SBOM document creator and package supplier (e.g., 'Solace Corporation'). Required when report_profile is 'sbom', where it is also recorded as the document author (authorName). With another profile it is only valid together with report_parameters."
    required: false

runs:
  using: composite
  steps:
    - name: Generate FOSSA Report
      shell: bash
      env:
        # Inject all user-controlled inputs as OS environment variables so the
        # bash script never sees their values substituted inline as script text.
        # This prevents shell injection even if an input contains metacharacters.
        FOSSA_API_KEY: ${{ inputs.fossa_api_key }}
        ORG_ID: ${{ inputs.org_id }}
        FOSSA_CONFIG_FILE: ${{ inputs.fossa_config_file }}
        FORMAT: ${{ inputs.format }}
        OUTPUT_FILE: ${{ inputs.output_file }}
        REPORT_PROFILE: ${{ inputs.report_profile }}
        PROJECT_LOCATOR: ${{ inputs.project_locator }}
        REVISION_ID: ${{ inputs.revision_id }}
        RELEASE_GROUP_ID: ${{ inputs.release_group_id }}
        RELEASE_ID: ${{ inputs.release_id }}
        REPORT_PARAMETERS: ${{ inputs.report_parameters }}
        SUPPLIER: ${{ inputs.supplier }}
        REPO_OWNER: ${{ github.repository_owner }}
        REGISTRY_ACTOR: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ github.token }}
      run: |
        # ---- Validate format (case-insensitive, as the container upper-cases it) ----
        VALID_FORMATS="HTML MD PDF CSV TXT SPDX SPDX_JSON SPDX3_JSON CYCLONEDX_JSON CYCLONEDX_XML"
        FORMAT_UPPER=$(printf '%s' "$FORMAT" | tr '[:lower:]' '[:upper:]')
        # Exact match per entry: a substring match would let "CSV TXT" through.
        FORMAT_OK=false
        for f in $VALID_FORMATS; do
          if [ "$FORMAT_UPPER" = "$f" ]; then FORMAT_OK=true; break; fi
        done
        if [ "$FORMAT_OK" != "true" ]; then
          echo "::error::Unsupported format '${FORMAT}'. Valid formats: ${VALID_FORMATS// /, }"
          exit 1
        fi

        # ---- Default the output file from the format when not given ----
        if [ -z "$OUTPUT_FILE" ]; then
          case "$FORMAT_UPPER" in
            TXT) EXT=txt ;;
            CSV) EXT=csv ;;
            HTML) EXT=html ;;
            MD) EXT=md ;;
            PDF) EXT=pdf ;;
            SPDX) EXT=spdx ;;
            SPDX_JSON) EXT=spdx.json ;;
            SPDX3_JSON) EXT=spdx3.json ;;
            CYCLONEDX_JSON) EXT=cdx.json ;;
            CYCLONEDX_XML) EXT=cdx.xml ;;
          esac
          OUTPUT_FILE="fossa-report.${EXT}"
          export OUTPUT_FILE
        fi

        # ---- Resolve SBOM profile / document metadata ----
        # Done here (not in the container) so no image rebuild is needed.
        # Callers that use neither the sbom profile nor supplier skip this block entirely.
        PROFILE_LOWER=$(printf '%s' "$REPORT_PROFILE" | tr '[:upper:]' '[:lower:]')
        if [ "$PROFILE_LOWER" = "sbom" ] || [ -n "$SUPPLIER" ]; then
          command -v jq > /dev/null || { echo "::error::jq is required for the sbom profile and the supplier input"; exit 1; }
          if [ -z "$REPORT_PARAMETERS" ] && [ "$PROFILE_LOWER" != "sbom" ]; then
            echo "::error::supplier needs report_profile 'sbom' or an explicit report_parameters JSON"
            exit 1
          fi
          if [ "$PROFILE_LOWER" = "sbom" ] && [ -z "$SUPPLIER" ]; then
            echo "::error::report_profile 'sbom' requires the supplier input (FOSSA otherwise emits an empty document creator)"
            exit 1
          fi
          if [ -n "$REPORT_PARAMETERS" ]; then
            printf '%s' "$REPORT_PARAMETERS" | jq -s -e 'length == 1 and (.[0] | type) == "object"' > /dev/null 2>&1 \
              || { echo "::error::report_parameters must be a single JSON object"; exit 1; }
          fi
          if [ "$PROFILE_LOWER" = "sbom" ]; then
            # SBOM defaults always apply; keys in a caller's report_parameters win over them.
            SBOM_DEFAULTS='{"includeDirectDependencies":true,"includeDeepDependencies":true,"includeLicenseList":true,"includeLicenseScan":true,"includeConcludedLicenses":true,"includeCopyrightList":true,"dependencyInfoOptions":["Library","License","FullTextLicense","Copyrights"]}'
            CALLER_PARAMS="${REPORT_PARAMETERS:-}"
            if [ -z "$CALLER_PARAMS" ]; then CALLER_PARAMS='{}'; fi
            REPORT_PARAMETERS=$(printf '%s' "$CALLER_PARAMS" | jq -c --argjson d "$SBOM_DEFAULTS" '$d * .') \
              || { echo "::error::failed to apply SBOM defaults to report_parameters"; exit 1; }
          fi
          # supplier is merged last, so it overrides caller keys. Under sbom it is also the
          # author (authorName), which is the NTIA minimum author element.
          if [ -n "$SUPPLIER" ]; then
            REPORT_PARAMETERS=$(printf '%s' "$REPORT_PARAMETERS" | jq -c --arg s "$SUPPLIER" --arg p "$PROFILE_LOWER" '
              .supplier = $s
              | (if $p == "sbom" then .authorName = $s else . end)') \
              || { echo "::error::failed to merge supplier into report_parameters"; exit 1; }
          fi
          export REPORT_PARAMETERS
          # 'sbom' is resolved here; the pinned image does not know that profile name.
          if [ "$PROFILE_LOWER" = "sbom" ]; then export REPORT_PROFILE=full; fi
        fi

        # ---- Release group mode: release_id is required; project_locator is ignored ----
        if [ -n "$RELEASE_GROUP_ID" ] && [ -z "$RELEASE_ID" ]; then
          echo "::error::release_id is required when release_group_id is provided"
          exit 1
        fi
        if [ -n "$RELEASE_GROUP_ID" ] && [ -n "$PROJECT_LOCATOR" ]; then
          echo "::warning::project_locator is ignored when release_group_id is provided"
        fi

        OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')

        # Authenticate to GHCR using the calling workflow's token so internal
        # org packages can be pulled. runs.using: docker did this automatically;
        # with composite + docker run we handle it explicitly.
        # Use an isolated DOCKER_CONFIG to avoid persisting credentials on
        # self-hosted runners' shared ~/.docker/config.json.
        DOCKER_CONFIG=$(mktemp -d "${RUNNER_TEMP}/docker-config.XXXXXX")
        export DOCKER_CONFIG
        STAGE_DIR=""
        trap 'docker logout ghcr.io > /dev/null 2>&1 || true; rm -rf "${DOCKER_CONFIG}" "${STAGE_DIR}"' EXIT
        echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_ACTOR" --password-stdin

        # The container only sees the workspace, RUNNER_TEMP and the GITHUB_OUTPUT dir.
        # A file written anywhere else (e.g. an absolute path on a file server) would be
        # discarded with the container (--rm) while the step still reports success.
        # For such a path the container writes to a staging dir under RUNNER_TEMP and the
        # file is copied to the real location on the host after the container succeeds.
        case "$OUTPUT_FILE" in
          "${GITHUB_WORKSPACE}"/*)
            OUTPUT_FILE="/github/workspace/${OUTPUT_FILE#"${GITHUB_WORKSPACE}"/}"
            export OUTPUT_FILE
            ;;
        esac
        FINAL_OUTPUT_FILE=""
        case "$OUTPUT_FILE" in
          "${RUNNER_TEMP}"/* | /github/workspace/*) ;;
          /*)
            FINAL_OUTPUT_FILE="$OUTPUT_FILE"
            STAGE_DIR=$(mktemp -d "${RUNNER_TEMP}/fossa-report.XXXXXX")
            chmod 0777 "$STAGE_DIR" # the container may run as a different user
            OUTPUT_FILE="${STAGE_DIR}/$(basename "$FINAL_OUTPUT_FILE")"
            export OUTPUT_FILE
            ;;
        esac

        # All inputs are already in the environment via the env: block above.

        # GITHUB_OUTPUT and GITHUB_STEP_SUMMARY live under _runner_file_commands/,
        # not under RUNNER_TEMP — mount their parent dir so the container can write outputs.
        GITHUB_OUTPUT_DIR=$(dirname "$GITHUB_OUTPUT")

        docker run --rm \
          -e FOSSA_API_KEY \
          -e ORG_ID \
          -e FOSSA_CONFIG_FILE \
          -e FORMAT \
          -e OUTPUT_FILE \
          -e REPORT_PROFILE \
          -e PROJECT_LOCATOR \
          -e REVISION_ID \
          -e RELEASE_GROUP_ID \
          -e RELEASE_ID \
          -e REPORT_PARAMETERS \
          -e GITHUB_OUTPUT \
          -e GITHUB_STEP_SUMMARY \
          -v "${GITHUB_WORKSPACE}:/github/workspace" \
          -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
          -v "${GITHUB_OUTPUT_DIR}:${GITHUB_OUTPUT_DIR}" \
          --workdir /github/workspace \
          "ghcr.io/${OWNER}/maas-build-actions@sha256:bab4c33e5a7930d248f3e8d1868f1ae8816c6fd44245540402d106f4afbe0634" \
          /bin/sh -c 'bash /maas-build-actions/actions/generate-fossa-report/generate-report.sh'

        # Publish a staged report to its real location (only reached if the container succeeded).
        if [ -n "$FINAL_OUTPUT_FILE" ]; then
          if [ ! -s "$OUTPUT_FILE" ]; then
            echo "::error::Report was not produced at ${OUTPUT_FILE}; nothing copied to ${FINAL_OUTPUT_FILE}"
            exit 1
          fi
          FINAL_DIR=$(dirname "$FINAL_OUTPUT_FILE")
          mkdir -p "$FINAL_DIR" || { echo "::error::Cannot create ${FINAL_DIR}"; exit 1; }
          # Copy to a temp name in the destination, then rename, so a partial file never has the final name.
          PART_FILE=$(mktemp "${FINAL_DIR}/.$(basename "$FINAL_OUTPUT_FILE").XXXXXX") \
            || { echo "::error::Cannot write to ${FINAL_DIR}"; exit 1; }
          if ! cp "$OUTPUT_FILE" "$PART_FILE" || ! mv -f "$PART_FILE" "$FINAL_OUTPUT_FILE"; then
            rm -f "$PART_FILE"
            echo "::error::Failed to copy report to ${FINAL_OUTPUT_FILE}"
            exit 1
          fi
          chmod 0644 "$FINAL_OUTPUT_FILE"
          if [ ! -s "$FINAL_OUTPUT_FILE" ]; then
            echo "::error::${FINAL_OUTPUT_FILE} is missing or empty after copy"
            exit 1
          fi
          echo "Report copied to ${FINAL_OUTPUT_FILE} ($(wc -c < "$FINAL_OUTPUT_FILE" | tr -d ' ') bytes)"
        fi
