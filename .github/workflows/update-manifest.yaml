name: Update Manifest

# Merges an item into a DynamoDB table, assuming a role via OIDC.
#
# Centralises the AWS wiring and the default-branch check. The item body is passed through
# unchanged, so callers control its shape and can include whatever fields they need.
#
# By default the write happens only on the repository's default branch: a pull request run is
# skipped, and the reason is reported in the job summary rather than silently succeeding.
#
# The write is a MERGE -- only the attributes present in the item are set, so attributes written
# by other jobs survive. Map-valued attributes are replaced wholesale, so supply the complete map.
#
# Usage:
#
#   update_manifest:
#     needs: sca_scan
#     if: needs.sca_scan.result == 'success'
#     uses: SolaceDev/solace-public-workflows/.github/workflows/update-manifest.yaml@main
#     with:
#       table_name: my-table
#       item: |
#         {
#           "squad": "my-squad",
#           "repository": "MY_REPO_EXPRESSION",
#           "dev": { "sha": "MY_SHA_EXPRESSION", "version": "MY_REF_EXPRESSION" }
#         }
#     secrets:
#       MANIFEST_AWS_ROLE: MY_SECRET_EXPRESSION
#
# The caller needs `id-token: write` at workflow or job level for OIDC. A caller that also runs
# another shared workflow must still grant whatever permissions that one declares -- this workflow
# needs no registry access, but that does not remove a sibling job's requirements.
#
# The calling repository must be authorised to assume the role, which requires configuration
# outside this workflow. Ask the platform team if the assume-role step fails.

on:
  workflow_call:
    inputs:
      item:
        description: >-
          JSON object to merge, including its primary key attributes. Templated by the caller, so
          any additional fields can be included.
        required: true
        type: string
      table_name:
        description: "DynamoDB table name"
        required: true
        type: string
      allow_non_default_branch:
        description: "Write even when the ref is not the repository's default branch"
        required: false
        type: boolean
        default: false
      partition_key:
        description: "Partition key attribute name"
        required: false
        type: string
        default: squad
      sort_key:
        description: "Sort key attribute name (empty for a partition-key-only table)"
        required: false
        type: string
        default: repository
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: us-east-1
    secrets:
      MANIFEST_AWS_ROLE:
        description: "ARN of the role to assume"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  update_manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Reports the decision instead of relying on a job-level `if:` in every caller, where a
      # skipped job is indistinguishable from a successful no-op.
      - name: Check branch
        id: target
        shell: bash
        env:
          ALLOW_NON_DEFAULT: ${{ inputs.allow_non_default_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ] || [ "$ALLOW_NON_DEFAULT" = "true" ]; then
            echo "should_write=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_write=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping write: ref '${REF_NAME}' is not the default branch ('${DEFAULT_BRANCH}'). Set allow_non_default_branch to override."
          {
            echo "### Write skipped"
            echo
            echo "Ref \`${REF_NAME}\` is not the default branch (\`${DEFAULT_BRANCH}\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        if: steps.target.outputs.should_write == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.MANIFEST_AWS_ROLE }}
          aws-region: ${{ inputs.aws_region }}

      - name: Update manifest
        if: steps.target.outputs.should_write == 'true'
        uses: SolaceDev/solace-public-workflows/.github/actions/update-manifest@DATAGO-update-manifest-action
        with:
          item: ${{ inputs.item }}
          table_name: ${{ inputs.table_name }}
          partition_key: ${{ inputs.partition_key }}
          sort_key: ${{ inputs.sort_key }}
          aws_region: ${{ inputs.aws_region }}
