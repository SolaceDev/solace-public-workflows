name: zizmor
on:
  pull_request:
permissions:
  contents: read
jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"          # pin CLI so the audit set is stable
          advanced-security: false   # fail the job on findings (no GHAS needed)
          persona: regular
