name: S3 +checkbranch
'on':
  workflow_call:
    inputs:
      item:
        description: JSON object to merge, including its primary key attributes. Templated by the caller, so any additional fields can be included.
        required: true
        type: string
      table_name:
        description: DynamoDB table name
        required: true
        type: string
      allow_non_default_branch:
        description: Write even when the ref is not the repository's default branch
        required: false
        type: boolean
        default: false
      partition_key:
        description: Partition key attribute name
        required: false
        type: string
        default: squad
      sort_key:
        description: Sort key attribute name (empty for a partition-key-only table)
        required: false
        type: string
        default: repository
      manifest_aws_role:
        description: ARN of the role to assume. A role ARN is an identifier, not a credential -- access is governed by the role's trust policy -- so a repo or org variable is usually the right home for it. Takes precedence over the secret of the same name.
        required: false
        type: string
        default: ''
      aws_region:
        description: AWS region
        required: false
        type: string
        default: us-east-1
    secrets:
      MANIFEST_AWS_ROLE:
        description: 'ARN of the role to assume, for callers that prefer to keep it secret. Optional: supply either this or the manifest_aws_role input. Prefer this over passing a secret into the input -- a secret passed through `with:` is treated as a plain string and is NOT masked in the called workflow''s logs.'
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  j:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Check branch
      id: target
      shell: bash
      env:
        ALLOW_NON_DEFAULT: ${{ inputs.allow_non_default_branch }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REF_NAME: ${{ github.ref_name }}
        HAS_ROLE: ${{ (inputs.manifest_aws_role != '' || secrets.MANIFEST_AWS_ROLE != '') && 'yes' || 'no' }}
      run: "set -euo pipefail\n\nif [ \"$HAS_ROLE\" != \"yes\" ]; then\n  # No ${{ }} in this message: a backslash does not escape an expression, so it would\n  # be parsed at validation time and fail the whole run before any job starts.\n  echo \"::error::No role ARN supplied. Pass the manifest_aws_role input (from a repo or org variable) or the MANIFEST_AWS_ROLE secret.\"\n  exit 1\nfi\n\nif [ \"$REF_NAME\" = \"$DEFAULT_BRANCH\" ] || [ \"$ALLOW_NON_DEFAULT\" = \"true\" ]; then\n  echo \"should_write=true\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\necho \"should_write=false\" >> \"$GITHUB_OUTPUT\"\necho \"::notice::Skipping write: ref '${REF_NAME}' is not the default branch ('${DEFAULT_BRANCH}'). Set allow_non_default_branch to override.\"\n{\n  echo \"### Write skipped\"\n  echo\n  echo \"Ref \\`${REF_NAME}\\` is not the default branch (\\`${DEFAULT_BRANCH}\\`).\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: noop
      shell: bash
      run: echo ok
